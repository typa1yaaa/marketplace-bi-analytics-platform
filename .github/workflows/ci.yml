name: ci
on: [push, pull_request]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: mp, POSTGRES_PASSWORD: mp, POSTGRES_DB: marketplace}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mp -d marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: mp
      PGPASSWORD: mp
      PGDATABASE: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Unit + SQL tests (hand-computed expectations)
        run: python -m pytest -q tests/test_generator.py tests/test_sql_analytics.py
      - name: Generate data and load into PostgreSQL
        run: |
          python -m src.generator.generate --out data
          python -m src.loader.load --data data
      - name: dbt build (models + data tests)
        run: cd dbt && dbt build --profiles-dir .
      - name: End-to-end checks (incident is found and localised)
        run: python -m pytest -q tests/test_e2e.py
      - run: python -m src.report
